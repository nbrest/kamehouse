import org.gradle.api.initialization.resolve.RepositoriesMode

pluginManagement {
  repositories {
    gradlePluginPortal()
    mavenCentral()
  }
}

plugins {
  // Enables automatic download of missing JDK toolchains from the Foojay
  // Disco API. Without this, the Java toolchain configured in the modules fails to
  // resolve on machines that only have an older JDK installed.
  id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'kamehouse'

include(
  'kamehouse-commons-core',
  'kamehouse-commons-test',
  'kamehouse-commons',
  'kamehouse-admin',
  'kamehouse-auth',
  'kamehouse-cmd',
  'kamehouse-desktop',
  'kamehouse-groot',
  'kamehouse-media',
  'kamehouse-mobile',
  'kamehouse-shell',
  'kamehouse-snape',
  'kamehouse-tennisworld',
  'kamehouse-testmodule',
  'kamehouse-ui',
  'kamehouse-vlcrc'
)

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
  repositories {
    // Local repository with kamehouse specific artifacts (ie. jvncsender)
    maven {
      name = 'localDependenciesRepository'
      url = rootDir.toPath().resolve("local-dependencies-repository").toUri()
      metadataSources {
        mavenPom()
        artifact()
      }
    }
    mavenCentral()
  }
}