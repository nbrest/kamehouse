[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kamehouse-desktop"
version = "0.0.0"
description = "KameHouse Desktop application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyQt5>=5.15.10,<6.0",
  "loguru>=0.7.2,<1.0",
  "requests>=2.31,<3.0",
  "urllib3>=2.0,<3.0",
  "websocket-client>=1.7,<2.0",
  "stomper>=0.4.3,<1.0",
  "tomli>=2.0,<3.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "coverage>=7.6,<8.0",
]

[tool.setuptools]
packages = []
