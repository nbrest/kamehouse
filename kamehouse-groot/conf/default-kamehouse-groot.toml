# kamehouse-groot configuration - default values

[groot]
host = "0.0.0.0"
port = 9091
log_level = "INFO"
deploy_path = "~/programs/kamehouse-groot"
user_home = "~"

db_host = "127.0.0.1"
db_port = 3306
db_name = "kamehouse"
db_user = "kamehouse"
db_password_secret = "MARIADB_PASS_KAMEHOUSE"

shell_bin = "~/programs/kamehouse-shell/bin"

scripts_csv = "csv/csv-kamehouse-shell.sh"

session_cookie_name = "kamehouse-groot-session"
