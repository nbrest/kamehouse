plugins {
  id 'com.github.spotbugs' version '6.5.13' apply false
  id 'org.sonarqube' version '7.5.0.8588' apply false
}

allprojects {
  group = 'com.nicobrest'
  version = '11.04.1-KAMEHOUSE-SNAPSHOT'
}

/*
 * Central place for every version/property that was defined in the Maven parent pom.xml.
 * Shared with the modules through rootProject.ext.kamehouseVersions.
 */
ext.kamehouseVersions = [
  'filters.dir'                      : 'src/main/filters',
  'java.target.version'              : '25',
  'project.build.sourceEncoding'     : 'UTF-8',

  // Dependency versions
  'bouncy.castle.version'           : '1.70',
  'commons.cli.version'              : '1.11.0',
  'commons.io.version'               : '2.22.0',
  'commons.lang3.version'            : '3.21.0',
  'commons.text.version'             : '1.15.0',
  'eddsa.version'                    : '0.3.0',
  'ehcache.version'                  : '3.12.0',
  'glassfish.jaxb.version'           : '2.3.1', // upgrading further breaks build
  'spotbugs.tool.version'            : '4.10.5',
  'hamcrest.version'                 : '3.0',
  // Transitive versions maven resolves, pinned to reproduce the maven conflict resolution
  'apiguardian.version'              : '1.1.2', // transitive of junit-jupiter-api
  'byte.buddy.version'               : '1.18.15',
  'hibernate.version'                : '6.6.59.Final',
  'hsql.version'                     : '2.7.4',
  'httpclient.version'               : '4.5.14',
  'jackson.version'                  : '2.22.4',
  'jakarta.annotation.version'       : '3.0.0',
  'jakarta.persistence.version'      : '3.1.0',
  'jakarta.servlet.version'          : '6.0.0',
  'jakarta.servlet.jsp.version'      : '3.1.1',
  'jakarta.websocket.version'        : '2.1.1',
  'jakarta.xml.bind.version'         : '4.0.5',
  'json.version'                     : '20260814',
  'jsoup.version'                    : '1.23.2',
  'junit.jupiter.version'            : '6.1.3',
  'junit.platform.version'           : '6.1.3',
  'jvncsender.version'               : '1.08',
  'logback.version'                  : '1.4.14',
  'mariadb.java.client.version'      : '4.0.0',
  'mockito.version'                  : '5.24.0',
  'quartz.version'                   : '2.5.2',
  'slf4j.version'                    : '2.0.20',
  'spring.version'                   : '6.2.19',
  'spring.security.version'          : '6.5.11',
  'spring.session.version'           : '3.5.7',
  'sshd.plugin.version'              : '2.20.0',

  // Tool versions
  'checkstyle.puppycrawl.version'    : '14.3.0',
  'jacoco.version'                   : '0.8.15'
]

/*
 * Resource filtering profiles. Equivalent to the maven <profiles> (prod is the default one).
 * Select with -PkamehouseProfile=ci / -PkamehouseProfile=docker, or the KAMEHOUSE_PROFILE env var.
 */
ext.kamehouseProfile = (findProperty('kamehouseProfile') ?: System.getenv('KAMEHOUSE_PROFILE') ?: 'prod')

if (!(ext.kamehouseProfile in ['prod', 'ci', 'docker'])) {
  throw new GradleException(
    "Invalid kamehouseProfile '${ext.kamehouseProfile}'. Valid profiles are: prod, ci, docker")
}

ext.commonsLoggingExclusion = [group: 'commons-logging', module: 'commons-logging']

tasks.register('printVersions') {
  group = 'help'
  description = 'Prints the project version, the java version and the selected build profile.'
  doLast {
    println "kamehouse version : ${project.version}"
    println "java version      : ${rootProject.ext.kamehouseVersions['java.target.version']}"
    println "build profile     : ${rootProject.ext.kamehouseProfile}"
    println "project dir       : ${rootDir}"
  }
}

/*
 * Prints only the project version, in a single line and without any other gradle output. Replaces the
 * kamehouse-shell parsing of the version of the maven parent pom.xml.
 */
tasks.register('printVersion') {
  group = 'help'
  description = 'Prints the project version, ie. 11.04.1-KAMEHOUSE-SNAPSHOT.'
  doLast {
    println project.version
  }
}

/*
 * Sonar analysis. Replaces the org.sonarsource.scanner.maven:sonar-maven-plugin invocation of the
 * CI pipeline:
 *
 *   ./gradlew build sonar -Psonar -Dsonar.projectKey=nbrest_kamehouse
 *
 * The sonar.organization and sonar.host.url properties are defined in gradle.properties
 */
if (providers.gradleProperty('sonar').isPresent()) {
  apply plugin: 'org.sonarqube'

  sonar {
    properties {
      // The sonar.organization and sonar.host.url values defined in gradle.properties are NOT
      // forwarded automatically by the sonarqube plugin (only -Dsonar.* system properties and
      // SONAR_* environment variables are), so forward them to the scanner explicitly.
      property 'sonar.organization', project.findProperty('sonar.organization')
      property 'sonar.host.url', project.findProperty('sonar.host.url')
    }
  }
}