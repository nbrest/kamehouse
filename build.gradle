plugins {
  id 'com.github.spotbugs' version '6.2.7' apply false
  id 'org.sonarqube' version '7.5.0.8588' apply false
}

allprojects {
  group = 'com.nicobrest'
  version = '11.04.1-KAMEHOUSE-SNAPSHOT'
}

/*
 * Central place for every version/property that was defined in the Maven parent pom.xml.
 * Shared with the modules through rootProject.ext.kamehouseVersions.
 *
 * Dates in the comments are kept from the original pom.xml.
 */
ext.kamehouseVersions = [
  'filters.dir'                      : 'src/main/filters',
  'java.target.version'              : '21',
  'kamehouse.version'                : '11.04.1-KAMEHOUSE-SNAPSHOT',
  'project.build.sourceEncoding'     : 'UTF-8',
  'sonar.organization'               : 'nbrest',
  'sonar.host.url'                   : 'https://sonarcloud.io',

  // Maven plugin versions (kept for reference, Gradle uses its own plugin coordinates)
  'assembly.plugin.version'          : '3.6.0',
  'compiler.plugin.version'          : '3.11.0',
  'dependency.plugin.version'        : '3.6.0',
  'failsafe.plugin.version'          : '3.1.2',
  'jar.plugin.version'               : '3.3.0',
  'surefire.plugin.version'          : '3.1.2',
  'war.plugin.version'               : '3.4.0',

  // Dependency versions
  'bouncy.castle.version'           : '1.70',            // 2021/12
  'commons.cli.version'              : '1.5.0',          // 2021/10
  'commons.io.version'               : '2.13.0',         // 2023/06
  'commons.lang3.version'            : '3.12.0',         // 2021/03
  'commons.text.version'             : '1.10.0',         // 2022/09
