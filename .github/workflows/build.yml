name: Build
on:
  push:
    branches:
      - dev
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          distribution: 'zulu'
          # gradle, the tests, the sonar analysis and the compilation all run on jdk 21. The code
          # is compiled with --release 21 (java.target.version in build.gradle), so the artifacts
          # are java 21
          java-version: 21
          java-package: jdk
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle
      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # The sonarqube plugin is only applied when the build runs with -Psonar. The
        # sonar.organization and sonar.host.url properties are in gradle.properties and are
        # forwarded to the scanner by the sonar{} block in build.gradle.
        run: ./gradlew clean build sonar -Psonar --no-daemon --console=plain -Dsonar.projectKey=nbrest_kamehouse
