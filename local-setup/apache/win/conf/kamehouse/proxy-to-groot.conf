# Define GROOT_PORT and BATCAVE_GROOT_PORT in each vhost in conf/kamehouse/vhost/

ProxyPreserveHost	On

ProxyPass /kame-house-groot http://127.0.0.1:${GROOT_PORT}/kame-house-groot
ProxyPassReverse /kame-house-groot http://127.0.0.1:${GROOT_PORT}/kame-house-groot

ProxyPass /kame-house-batcave-groot http://127.0.0.1:${BATCAVE_GROOT_PORT}/kame-house-batcave-groot
ProxyPassReverse /kame-house-batcave-groot http://127.0.0.1:${BATCAVE_GROOT_PORT}/kame-house-batcave-groot
